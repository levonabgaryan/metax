# Base service skeletons (postgres, embeddings, redis).
#
# This file is NOT runnable on its own. It is consumed via `extends:` from
# docker-compose.dev.yml / docker-compose.prod.yml / docker-compose.test.yml,
# each of which is responsible for providing concrete values (either by
# hardcoding `environment:` overrides or by adding `env_file: .env`).
#
# Healthcheck values reference env vars with `$$VAR` so Compose passes them
# through and the container shell expands them at runtime (single `$` would
# be substituted by Compose at parse time and leak host vars / blank values).

services:
  metax-postgres-db:
    # pgvector/pgvector ships the `vector` extension on top of the official Postgres image.
    image: pgvector/pgvector:pg18
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5

  metax-embeddings:
    # sentence-transformers (PyTorch, CPU) serving the Armenian E5 model for vector search.
    # The model is downloaded into the mounted /data volume on first boot, so subsequent
    # boots reuse the cache. Listens on port 80 inside the container.
    build:
      context: .
      dockerfile: ./Dockerfile.embeddings
    healthcheck:
      # No curl in the slim image; use python. /health only succeeds once the model is loaded.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:80/health')\" || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 180s

  metax-redis:
    image: redis:8.4.0-alpine
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
